# Per-1M-token USD prices by model identity. Committed schema; OSS-portable.
#
# Per-user overrides live in `profile/model_costs.toml` (gitignored,
# last-wins). One row per identity declared in `harness/models.toml`.
#
# Schema:
#   input_per_1m_usd         input tokens per 1M, USD
#   output_per_1m_usd        output / completion tokens per 1M, USD
#   reasoning_per_1m_usd     (optional) separately-priced reasoning tokens
#   last_verified            "YYYY-MM-DD" — when this row's prices were checked
#                            against the provider's published rate card.
#                            `scripts/shadow.py report` fails closed when any
#                            aggregated model is >90 days stale, unless
#                            invoked with `--accept-stale-costs`.
#
# Prices for the major flagship and mid-tier identities as of 2026-05-21
# (public rate cards). Refresh quarterly; the report's fail-closed gate is
# the forcing function. Missing prices → the report treats that model as
# unknown-cost (no $ column for it) rather than erroring out.

[costs.opus]
input_per_1m_usd = 15.00
output_per_1m_usd = 75.00
last_verified = "2026-05-21"

[costs.sonnet]
input_per_1m_usd = 3.00
output_per_1m_usd = 15.00
last_verified = "2026-05-21"

[costs.haiku]
input_per_1m_usd = 0.80
output_per_1m_usd = 4.00
last_verified = "2026-05-21"

[costs.deepseek_pro_max]
input_per_1m_usd = 0.27
output_per_1m_usd = 1.10
reasoning_per_1m_usd = 1.10
last_verified = "2026-05-21"

[costs.deepseek_pro]
input_per_1m_usd = 0.27
output_per_1m_usd = 1.10
last_verified = "2026-05-21"

[costs.deepseek_flash]
input_per_1m_usd = 0.07
output_per_1m_usd = 0.28
last_verified = "2026-05-21"

[costs.codex_gpt55_max]
# OpenAI gpt-5.5 (high reasoning effort). Codex CLI does not currently
# surface usage tokens to parents; cost from this leg is char_approx in
# the report.
input_per_1m_usd = 5.00
output_per_1m_usd = 20.00
last_verified = "2026-05-21"
