# Portable intent router registry.
#
# Canonical registry of `/hi <context>` intent rules. Each row maps a set of
# trigger phrases / format markers to a routing decision: which mode of /hi to
# invoke, which agents the orchestrator should expect to dispatch, and which
# profile files to pre-read.
#
# Source of truth: this file. `.claude/commands/hi.md` consumes the selected
# row; the prose does not duplicate trigger phrases, procedures, or agent
# lists. To add or change a route, edit this file and the selected procedure.
#
# Discoverability: Codex and other tools read this TOML directly; no helper
# subcommand. The orchestrator surfaces the matched intent inline on every
# `/hi` dispatch (see hi.md § Load and dispatch); there is no
# opt-in flag.
#
# Schema:
#   patterns                  list of trigger phrases / format markers (case
#                             insensitive, substring-match by default; the
#                             dispatch helper treats list members as ORed)
#   mode                      string identifier of a /hi sub-mode (e.g.,
#                             "capture-fast-path", "read-and-discuss")
#   procedure                 authoritative project-relative workflow file;
#                             the router reads only this file after selection
#   context_budget_bytes      default serialized context projection budget;
#                             operational rows are skipped by /hi even though
#                             the helper retains a small diagnostic budget
#   agents                    list of agent keys from harness/agents.toml
#                             that the orchestrator expects to dispatch
#                             (informational; not a hard contract)
#   profile_reads             list of filenames under profile/ that the
#                             orchestrator should pre-read before dispatch
#   priority                  int; higher = more specific, matched first.
#                             The fallback intent is priority = 0.
#   pattern                   coordination pattern (one of:
#                             "orchestrator-subagent", "generator-verifier",
#                             "agent-team", "shared-state", "solo")
#   expected_subagent_count   int hint for review tooling and dispatch-shape
#                             reasoning. 1 if a single agent; otherwise the
#                             typical-case count.
#   parallel                  bool; whether the agents dispatch in parallel
#                             (informational; the actual dispatch shape is
#                             still the orchestrator's call)
#
# Design note: keep the schema minimal and stable. Resist fields that encode
# current-model assumptions (model ids, token budgets, specific tool names).
# `pattern` is annotation only — see `protocols/orchestrator.md` § Pattern
# field contract for the no-branching rule and the closed 5-value enum.
#
# Coverage feedback loop: unclassified `/hi` inputs are logged for batch
# review. Phrases recurring above the threshold are candidate triggers for
# rows here. Contract, schema, threshold, and report workflow live in
# `protocols/intent-coverage.md` (single source of truth — do not restate
# path / threshold here).

# Active intents are reachable through `/hi <natural language>` and their
# explicit runtime command surfaces. Each row's `procedure` points directly at
# the authoritative workflow file.

# Weekly review of the past 7 days. Procedure: .claude/commands/weekly.md.
[intents.weekly]
patterns = [
    "weekly review",
    "weekly",
    "this week",
    "past 7 days",
    "past week",
    "weekly check-in",
    "run weekly",
]
mode = "weekly-review"
procedure = ".claude/commands/weekly.md"
context_budget_bytes = 8192
agents = []
profile_reads = ["identity.md", "directions.md"]
priority = 45
pattern = "solo"
expected_subagent_count = 0
parallel = false

# Decision journal: structured framework cross-validation for a hard choice.
# Procedure: .claude/commands/decision.md. Retrieval runs inline; the only
# dispatch is the Thinker (dual-leg at this call site).
[intents.decision]
patterns = [
    "should I",
    "help me decide",
    "help me think through",
    "torn between",
    "torn on whether",
    "decision journal",
    "make a decision",
]
mode = "decision-journal"
procedure = ".claude/commands/decision.md"
context_budget_bytes = 6144
agents = ["thinker"]
profile_reads = ["identity.md", "directions.md"]
priority = 35
pattern = "orchestrator-subagent"
expected_subagent_count = 1
parallel = false

# Open exploration: surface forgotten threads, cross-domain links, evolution
# of thinking. Procedure: .claude/commands/explore.md. The orchestrator runs
# the wide net of semantic + grep + time-shifted searches inline.
[intents.explore]
patterns = [
    "explore",
    "wander",
    "what am I missing",
    "forgotten connections",
    "open threads",
    "what's interesting",
]
mode = "open-exploration"
procedure = ".claude/commands/explore.md"
context_budget_bytes = 6144
agents = []
profile_reads = ["identity.md"]
priority = 22
pattern = "solo"
expected_subagent_count = 0
parallel = false

# Promote L2 notes into a schema-compliant L4 wiki entry. Procedure:
# .claude/commands/promote.md. Researcher (Phase 1 candidate gather) then
# Curator (Phase 2 draft); sequential, so parallel = false.
[intents.promote]
patterns = [
    "promote to wiki",
    "promote this",
    "L4 entry",
    "canonize this",
    "create wiki entry",
    "wiki promote",
]
mode = "promote"
procedure = ".claude/commands/promote.md"
context_budget_bytes = 4096
agents = ["researcher", "curator"]
profile_reads = []
priority = 14
pattern = "orchestrator-subagent"
expected_subagent_count = 2
parallel = false

# Wiki + harness lint suite. Procedure: .claude/commands/lint.md. Purely
# script-driven (harness_lint.py, lint.py, staleness.py, privacy_check.py,
# zk_audit.py, auto_memory_audit.py); no subagent dispatch, hence
# `agents = []` and expected_subagent_count = 0.
[intents.lint]
patterns = [
    "lint the wiki",
    "wiki audit",
    "structural checks",
    "wiki orphans",
    "run lint",
    "wiki lint",
]
mode = "lint"
procedure = ".claude/commands/lint.md"
context_budget_bytes = 4096
agents = []
profile_reads = []
priority = 12
pattern = "solo"
expected_subagent_count = 0
parallel = false

# Explicit reflection requests stay deterministic, then hand off to the
# active runtime/application flow. The retired daily-reflection procedure is
# archived and must not be loaded from this route.
[intents.reflection]
patterns = [
    "daily reflection",
    "let's reflect",
    "reflect on",
    "每日复盘",
    "复盘今天",
    "反思一下",
]
mode = "reflection-handoff"
procedure = "protocols/intent-reflection.md"
context_budget_bytes = 4096
agents = []
profile_reads = []
priority = 10
pattern = "solo"
expected_subagent_count = 0
parallel = false

# Fallback: the deterministic registry has no high-confidence match. Hand the
# request back to the active runtime's semantic skill / app / tool routing.
[intents.general]
patterns = []
mode = "semantic-handoff"
procedure = "protocols/intent-general.md"
context_budget_bytes = 4096
agents = []
profile_reads = []
priority = 0
pattern = "solo"
expected_subagent_count = 0
parallel = false
