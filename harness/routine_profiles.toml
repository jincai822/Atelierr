version = 1

# Public, routine-agnostic capability profiles. Private routine names and
# output paths stay in $OV/_meta/routine_watch.toml and reference these rows.

[profiles.local-maintenance]
surface = "local"
sandbox = "danger-full-access"
atelier_access = "read-write"
web_search = "disabled"
shell_network = "unrestricted"
user_config = "ignore"
timeout_seconds = 7200
reasoning_effort = "high"
permissions = [
  "atelier:read-write",
  "vault:read-write",
  "vault:git-commit",
  "shell:local",
]
required_clis = ["git", "uv"]
required_plugins = []
optional_plugins = []
allowed_commands = ["/autoevo-nightly"]

[profiles.local-research]
surface = "local"
sandbox = "workspace-write"
atelier_access = "read"
web_search = "live"
shell_network = "disabled"
user_config = "ignore"
timeout_seconds = 1800
reasoning_effort = "medium"
permissions = [
  "atelier:read",
  "vault:read-write",
  "web:live",
]
required_clis = []
required_plugins = []
optional_plugins = []
allowed_commands = ["/run-routine"]

[profiles.local-synthesis]
surface = "local"
