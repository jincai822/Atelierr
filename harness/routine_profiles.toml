version = 1

# Public, routine-agnostic capability profiles. Private routine names and
# output paths stay in $OV/_meta/routine_watch.toml and reference these rows.
# Local command profiles are intentionally absent: `/autoevo-nightly` and
# `/run-routine` were frozen by the 2026-09-20 workshop surgery. Cloud-only
# profiles remain available for explicitly configured remote routines.

[profiles.cloud-drive-research]
surface = "cloud"
web_search = "live"
reasoning_effort = "medium"
permissions = [
  "google-drive:read-write",
  "web:live",
]
required_connectors = ["google-drive"]
optional_connectors = []

[profiles.cloud-drive-synthesis]
surface = "cloud"
web_search = "disabled"
reasoning_effort = "low"
permissions = ["google-drive:read-write"]
required_connectors = ["google-drive"]
optional_connectors = []

[profiles.cloud-gmail-drive-synthesis]
surface = "cloud"
web_search = "disabled"
reasoning_effort = "low"
permissions = [
  "gmail:read",
  "google-drive:read-write",
]
required_connectors = ["gmail", "google-drive"]
optional_connectors = []

[profiles.cloud-digest]
surface = "cloud"
web_search = "live"
reasoning_effort = "low"
permissions = [
  "google-drive:read-write",
  "web:live",
]
required_connectors = ["google-drive"]
optional_connectors = ["gmail", "readwise"]
