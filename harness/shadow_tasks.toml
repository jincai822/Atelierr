# Per-task-type verdict-token extraction rules for `scripts/shadow.py report`.
#
# Schema:
#   verdict_pattern         Python regex; word-boundary anchored
#   case_insensitive        bool; report applies re.IGNORECASE if true
#   last_match_wins         bool; if true, the LAST regex match in the
#                           response is the verdict (verdicts usually sit at
#                           the end of a structured review). If false, first
#                           match wins.
#
# Tasks without a row here get cost+latency in the report; verdict-agreement
# is N/A for them.

[tasks.system-review]
# DORMANT: no dispatch site emits this task type yet (the only producers
# today are --task decision, privacy-review, external-review); reserved for
# future instrumentation of the /system-review reviewer legs.
# REJECTED (not REJECT) is the actual rubric token in .claude/agents/reviewer.md.
verdict_pattern = '\b(APPROVED|APPROVED_WITH_NOTES|NEEDS_REVISION|REJECTED)\b'
case_insensitive = false
last_match_wins = true

[tasks.privacy-review]
verdict_pattern = '\b(CLEAN|NEEDS_REVISION|BLOCKER)\b'
case_insensitive = false
last_match_wins = true

[tasks.decision]
# Decision-journal verdicts emit from prose framework analyses; the regex
# requires an explicit "Verdict:" anchor line. If the agent doesn't emit one,
# the row shows verdict=N/A and falls back to cost+latency only.
verdict_pattern = '(?m)^\*?\*?Verdict\*?\*?:\s*(proceed|defer|reject)\b'
case_insensitive = true
last_match_wins = true

[tasks.fact-check]
# DORMANT: no dispatch site emits this task type yet; reserved for future
# instrumentation of the quantitative-claim fact-check gate
# (protocols/orchestrator.md -> "Voice Dispatch").
verdict_pattern = '\b(verified|unverified|unknown|disputed)\b'
case_insensitive = true
last_match_wins = true

[tasks.external-review]
verdict_pattern = '\b(APPROVED|APPROVED_WITH_NOTES|NEEDS_REVISION|REJECTED)\b'
case_insensitive = false
last_match_wins = true
