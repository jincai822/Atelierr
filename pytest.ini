[pytest]
; 只收集 Atelierr 测试；tests/ 根层的 test_*.py 属于 Atelier 框架
; （由 harness_smoke 用 unittest 运行），两套体系互不收集
testpaths = tests/unit tests/integration tests/e2e tests/performance
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --cov=scripts/memory
    --cov=scripts/web
    --cov=scripts/processors
    --cov=scripts/cli
    --cov=scripts/utils
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
pythonpath = .
