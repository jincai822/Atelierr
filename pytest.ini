[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --cov=scripts/memory
    --cov=scripts/web
    --cov=scripts/processors
    --cov=scripts/cli
    --cov=scripts/utils
    --cov-report=html
    --cov-report=term-missing
