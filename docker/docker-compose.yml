# Atelierr - 底座服务部署（同步）
#
# 用法:
#   cp .env.example .env   # 修改数据目录等
#   docker compose up -d
#
# 2026-09-18 用户裁决：Flatnotes 网页版（MVP 2）退役——入口收敛为
# Obsidian + 飞书；外部写入的归一化由 scripts/web/integration.py
# （WebIntegration，纯文件系统门面）负责，不依赖任何 Web 服务在线。

services:
  # 手机端同步（OBSIDIAN-SYNC-PLAN-DRAFT.md）：与手机 Syncthing-Fork 双向同步
  # 同一个 $OV/memory 目录；host 网络用于局域网发现与 WireGuard 直连
  syncthing:
    image: syncthing/syncthing:latest
    container_name: atelierr-syncthing
    network_mode: host
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      # 镜像默认 STGUIADDRESS=0.0.0.0:8384 会把管理台暴露到局域网；收回 localhost
      STGUIADDRESS: "127.0.0.1:8384"
    volumes:
      - "./syncthing-config:/var/syncthing/config"
      # 同步整个 $OV 数据树（memory/cognition/reflections 都进手机）；
      # 排除规则见 $OV/.stignore（state/、sessions/、exports/ 不同步）
      - "${OV_DATA_DIR:-./data}:/data"
    restart: unless-stopped
